<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#081321">
<title>Confirmation de commande — E-BAGS UNLOCK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#081321;--panel:#101f31;--blue:#6da5dc;--white:#f5f8fc;--muted:#aab7c7;--border:rgba(255,255,255,.12);--success:#55c995;--error:#ff7777}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,rgba(52,119,190,.25),transparent 52%),linear-gradient(145deg,#050b16,#0a1a2d 48%,#07101e);color:var(--white);font-family:Inter,sans-serif;display:flex;flex-direction:column}
header{padding:22px 20px;border-bottom:1px solid var(--border);background:rgba(8,19,33,.95);text-align:center}.logo{font-size:25px;font-weight:800;letter-spacing:-1px;text-decoration:none;color:var(--white)}.logo span{color:var(--blue)}.logo .apple-mark{color:var(--white);margin-left:5px;font-family:Arial,sans-serif;font-size:.95em}
nav{display:flex;justify-content:center;flex-wrap:wrap;gap:12px 24px;margin-top:13px}nav a{font-size:13px;color:var(--muted);text-decoration:none}
.site-footer{margin-top:auto;padding:24px 20px;text-align:center;border-top:1px solid var(--border);background:rgba(8,19,33,.72)}.footer-logo{display:inline-block;color:var(--white);font-size:22px;font-weight:800;letter-spacing:-1px;text-decoration:none}.footer-logo span:not(.apple-mark){color:var(--blue)}.footer-logo .apple-mark{color:var(--white);margin-left:5px;font-family:Arial,sans-serif;font-size:.95em}
main{width:min(680px,calc(100% - 32px));margin:auto;padding:65px 0;text-align:center}
.check{width:62px;height:62px;margin:0 auto 25px;border:2px solid var(--success);border-radius:50%;display:grid;place-items:center;color:var(--success);font-size:34px}
h1{font-size:clamp(25px,5vw,34px);margin:0 0 15px}.message{color:var(--muted);line-height:1.8;margin:0 auto 30px}
button{min-width:95px;padding:12px 28px;border:1px solid var(--border);border-radius:7px;background:var(--blue);color:#fff;font:600 15px Inter,sans-serif;cursor:pointer}
#status{color:var(--error);white-space:pre-wrap;line-height:1.6}#retry{display:none;margin-top:15px}
.language-picker{display:inline-flex;align-items:center;justify-content:center;position:relative;width:38px;height:38px}.language-picker select{width:38px;height:38px;border:1px solid var(--blue);border-radius:50%;background:#0b1929;color:var(--white);font-size:10px;cursor:pointer}
#google_translate_element{display:none!important}.goog-te-banner-frame{display:none!important}body{top:0!important}
</style>
</head>
<body>
<header>
<a class="logo" href="https://ebagzunlock.com/">ebagz<span>unlock</span><span class="apple-mark" aria-hidden="true"> </span></a>
<nav aria-label="Navigation principale">
<a href="https://ebagzunlock.com/">Accueil</a>
<a href="https://ebagzunlock.com/?page=offres#services">Services</a>
<a href="https://ebagzunlock.com/?page=offres#tarifs">Tarifs</a>
<a href="https://ebagzunlock.com/?page=offres#fonctionnement">Fonctionnement</a>
<label class="language-picker" aria-label="Choisir la langue"><select id="languageSelect" aria-label="Choisir la langue">
<option value="fr">Français</option><option value="en">English</option><option value="es">Español</option><option value="pt">Português</option><option value="de">Deutsch</option><option value="it">Italiano</option><option value="ar">العربية</option><option value="zh-CN">中文</option><option value="ja">日本語</option><option value="hi">हिन्दी</option><option value="ru">Русский</option><option value="nl">Nederlands</option>
</select></label>
</nav><div id="google_translate_element" hidden></div>
</header>
<main>
<div class="check" id="check" hidden>✓</div>
<h1 id="title">Vérification de votre paiement…</h1>
<p class="message" id="message">Nous confirmons votre règlement et préparons votre confirmation de commande.</p>
<p id="status" role="alert"></p>
<button id="ok" type="button" hidden>OK</button>
<button id="retry" type="button">Réessayer</button>
</main>
<script>
"use strict";
const languageSelect=document.getElementById("languageSelect");
let savedLanguage="fr";
try{savedLanguage=localStorage.getItem("ebagzunlock-language")||"fr";}catch(error){}
if(languageSelect)languageSelect.value=Array.from(languageSelect.options).some(o=>o.value===savedLanguage)?savedLanguage:"fr";
if(savedLanguage!=="fr"){document.cookie="googtrans=/fr/"+savedLanguage+";path=/;max-age=31536000;SameSite=Lax";document.cookie="googtrans=/fr/"+savedLanguage+";domain="+location.hostname+";path=/;max-age=31536000;SameSite=Lax";}
if(languageSelect)languageSelect.addEventListener("change",event=>{
const lang=event.target.value;
try{localStorage.setItem("ebagzunlock-language",lang);}catch(error){}
if(lang==="fr"){document.cookie="googtrans=;path=/;max-age=0";document.cookie="googtrans=;domain="+location.hostname+";path=/;max-age=0";}
else{document.cookie="googtrans=/fr/"+lang+";path=/;max-age=31536000;SameSite=Lax";document.cookie="googtrans=/fr/"+lang+";domain="+location.hostname+";path=/;max-age=31536000;SameSite=Lax";}
location.reload();
});
function googleTranslateElementInit(){if(window.google&&google.translate){new google.translate.TranslateElement({pageLanguage:"fr",includedLanguages:"en,es,pt,de,it,ar,zh-CN,ja,hi,ru,nl",autoDisplay:false},"google_translate_element");}}

const sessionId=new URLSearchParams(location.search).get("session_id");
const statusEl=document.getElementById("status");
let busy=false;
let attempts=0;
async function confirmOrder(){
if(busy)return;
busy=true;
attempts++;
document.getElementById("retry").style.display="none";
statusEl.textContent="";
try{
if(!sessionId)throw new Error("Référence de paiement absente.");
const checkResponse=await fetch("/api/verify-checkout-session?session_id="+encodeURIComponent(sessionId));
const checkData=await checkResponse.json();
if(!checkResponse.ok||checkData.paid!==true)throw new Error("Le paiement n'a pas pu être confirmé. Si vous avez été débité, contactez-nous.");
const orderResponse=await fetch("/api/submit-order",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sessionId})});
const orderData=await orderResponse.json();
if(!orderResponse.ok||orderData.success!==true)throw new Error(orderData.error||"La confirmation automatique a échoué. Réessayez.");
document.getElementById("check").hidden=false;
document.getElementById("title").textContent="Commande confirmée et paiement reçu";
document.getElementById("message").textContent="Votre commande a bien été envoyée. Votre facture vient également d'être envoyée par e-mail.";
document.getElementById("ok").hidden=false;
try{sessionStorage.removeItem("ebagzunlock-pending-payment");sessionStorage.removeItem("ebagzunlock-pending-order");}catch(error){}
}catch(error){
statusEl.textContent=error.message||"Une erreur est survenue.";
document.getElementById("title").textContent="Confirmation en attente";
document.getElementById("message").textContent="Votre paiement peut avoir été effectué. Nous n'avons pas encore terminé la confirmation de la commande.";
document.getElementById("retry").style.display="inline-block";
if(attempts<5)setTimeout(confirmOrder,2500);
}finally{busy=false;}
}
document.getElementById("ok").addEventListener("click",()=>{location.href="https://ebagzunlock.com/";});
document.getElementById("retry").addEventListener("click",confirmOrder);
confirmOrder();
</script>
<footer class="site-footer"><a class="footer-logo" href="https://ebagzunlock.com/">ebagz<span>unlock</span><span class="apple-mark" aria-hidden="true"> </span></a><p><a href="/conditions-generales.html" style="color:var(--muted);font-size:13px;text-decoration:underline">Conditions générales d’achat</a></p></footer>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async></script>
<script id="ebagz-translate-all-visible-text">
(()=> {
 document.documentElement.setAttribute("translate","yes");
 if(document.body)document.body.setAttribute("translate","yes");
 const protectBrand=()=>{
  document.querySelectorAll(".site-header .header-logo,.site-footer .footer-logo,header .logo,.brand-inline,.apple-mark").forEach(el=>{
   el.classList.add("notranslate");
   el.setAttribute("translate","no");
  });
 };
 protectBrand();
 document.addEventListener("DOMContentLoaded",protectBrand);
})();
</script>
<style id="ebagz-navigation-spacing-final">
.site-header .header-right .main-nav{gap:clamp(8px,1.7vw,16px)!important}
.site-header .header-right .main-nav a,.site-header .header-right .main-nav button{
 font-size:clamp(10px,2.5vw,12px)!important;
 font-weight:600!important;
 letter-spacing:0!important;
}

.site-header .header-right.contact-open .main-nav{flex:0 0 100%!important;order:1!important;justify-content:center!important}

.site-header .header-right .contact-icons[hidden]{display:none!important}

.site-header .contact-icons svg{width:22px!important;height:22px!important}
@media(max-width:420px){
 .site-header .header-right .main-nav{gap:clamp(6px,1.5vw,9px)!important}
 .site-header .header-right .main-nav a,.site-header .header-right .main-nav button{font-size:10px!important}
}
</style>
<style id="ebagz-company-name-white">
.site-header .logo,.site-header .logo .logo-blue,.site-header .logo-blue,
.site-footer .footer-logo,.site-footer .footer-logo .logo-blue,
.footer-logo span:not(.apple-mark),header .logo span:not(.apple-mark),
.logo-blue,.brand-inline,.brand-inline .logo-blue,
.logo .apple-mark,.footer-logo .apple-mark,.apple-mark{color:#fff!important}
</style>
</body>
</html>
