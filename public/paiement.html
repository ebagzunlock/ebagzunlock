<script>
"use strict";
const PUBLISHABLE_KEY="pk_live_51UXyGX75EdsO57RNKonjBJn7r6Q2m2tGmlhzXpz9eQMs2c1ZDmVsp7oecok3jBg3xvcFsUkL3dyjZcKrvGs9iAic00hn3wyox8";
const params=new URLSearchParams(location.search);
let stripeReady=false;
if(sessionStorage.getItem("ebagzunlock-consent-accepted")!=="true"){location.replace("/recapitulatif.html");}

// Synchroniser le sélecteur de langue avec le choix déjà fait sur le site.
const languageSelect=document.getElementById("languageSelect");
let selectedLanguage="fr";
try{selectedLanguage=localStorage.getItem("ebagzunlock-language")||"fr";}catch(error){}
if(languageSelect)languageSelect.value=Array.from(languageSelect.options).some(o=>o.value===selectedLanguage)?selectedLanguage:"fr";
if(languageSelect)languageSelect.addEventListener("change",event=>{
const lang=event.target.value;
try{localStorage.setItem("ebagzunlock-language",lang);}catch(error){}
document.cookie="googtrans=;path=/;max-age=0";
document.cookie="googtrans=;domain="+location.hostname+";path=/;max-age=0";
if(lang!=="fr"){
document.cookie="googtrans=/fr/"+lang+";path=/;max-age=31536000;SameSite=Lax";
document.cookie="googtrans=/fr/"+lang+";domain="+location.hostname+";path=/;max-age=31536000;SameSite=Lax";
}
location.reload();
});
function googleTranslateElementInit(){
if(window.google&&google.translate){
new google.translate.TranslateElement({pageLanguage:"fr",includedLanguages:"en,es,pt,de,it,ar,zh-CN,ja,hi,ru,nl",autoDisplay:false},"google_translate_element");
}
}
let savedSelection={},customer={};
try{savedSelection=JSON.parse(sessionStorage.getItem("ebagzunlock-pending-payment")||"{}");}catch(error){}
try{customer=JSON.parse(sessionStorage.getItem("ebagzunlock-pending-order")||"{}");}catch(error){}
const selection={
service:params.get("service")||savedSelection.service||"",
device:params.get("device")||savedSelection.device||"",
model:params.get("model")||savedSelection.model||""
};
const updatePrices={iOS:7,macOS:15,ebagzunlock:2};
const prices={
"iPhone":{"iPhone X":25,"iPhone XR":25,"iPhone XS":25,"iPhone XS Max":25,"iPhone 11":25,"iPhone 11 Pro":25,"iPhone 11 Pro Max":27,"iPhone 12 mini":25,"iPhone 12":25,"iPhone 12 Pro":29,"iPhone 12 Pro Max":32,"iPhone 13 mini":39,"iPhone 13":40,"iPhone 13 Pro":40,"iPhone 13 Pro Max":42,"iPhone 14":40,"iPhone 14 Plus":40,"iPhone 14 Pro":43,"iPhone 14 Pro Max":49,"iPhone 15":53,"iPhone 15 Plus":55,"iPhone 15 Pro":55,"iPhone 15 Pro Max":59,"iPhone 16":64,"iPhone 16 Plus":59,"iPhone 16 Pro":62,"iPhone 16 Pro Max":69,"iPhone 16e":65,"iPhone 17":69,"iPhone 17 Pro":70,"iPhone 17 Pro Max":77,"iPhone 17e":75,"iPhone 17 Air":79,"iPhone 18":85,"iPhone 18 Pro":89,"iPhone 18 Pro Max":100,"iPhone 18 Duo":95},
"MacBook":{"MacBook Air Intel 2008–2020":35,"MacBook Air M1":38,"MacBook Air M2 13/15 pouces":38,"MacBook Air M3 13/15 pouces":40,"MacBook Air M4 13/15 pouces":40,"MacBook Air M5 13/15 pouces":42,"MacBook Pro Intel":40,"MacBook Pro M1 13/14/16 pouces":45,"MacBook Pro M2":45,"MacBook Pro M3 14/16 pouces":45,"MacBook Pro M4 14/16 pouces":49,"MacBook Pro M5 14/16 pouces":49,"MacBook Pro M6 14 pouces":55,"MacBook 12 pouces 2015–2017":30,"MacBook Neo A18 Pro":133},
"iPad":{"iPad classique 1re–11e génération (A16 inclus)":37,"iPad mini 1–6 (A17 Pro inclus)":39,"iPad Air 1–5":37,"iPad Air M2/M3/M4 11/13 pouces":35,"iPad Pro 9.7 pouces":39,"iPad Pro 10.5 pouces":39,"iPad Pro 11 pouces générations 1–5":45,"iPad Pro 12.9 pouces générations 1–6":49,"iPad Pro M4 11/13 pouces":52,"iPad Pro M5 11/13 pouces":55},
"Apple Watch":{"Apple Watch Series 1–12":54,"Apple Watch SE 1/2/3":63,"Apple Watch Ultra 1/2/3/4":69}};
const updateService="Mise à jour iOS / macOS";
const amount=selection.service===updateService?updatePrices[selection.model]:prices[selection.device]?.[selection.model];
const validCustomer=customer.name&&customer.email&&customer.phone&&customer.identifier;
if(selection.service===updateService&&selection.device!==selection.model)amount=null;
if(!selection.service||!selection.device||!selection.model||!Number.isFinite(amount)||!validCustomer){
document.getElementById("status").textContent="Commande introuvable. Revenez au récapitulatif et vérifiez les informations.";
}else{
startCheckout();
}
async function startCheckout(){
const status=document.getElementById("status");
const button=document.getElementById("pay-button");
button.disabled=true;
try{
if(!window.Stripe)throw new Error("Le service de paiement Stripe ne se charge pas. Actualisez la page.");
const stripe=Stripe(PUBLISHABLE_KEY);
const clientSecretPromise=(async()=>{
const response=await fetch("/api/create-checkout-session",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({...selection,customer,consentAccepted:sessionStorage.getItem("ebagzunlock-consent-accepted")==="true",locale:(localStorage.getItem("ebagzunlock-language")||"fr")})
});
const data=await response.json();
if(!response.ok||!data.client_secret)throw new Error(data.error||"Impossible de préparer le paiement.");
return data.client_secret;
})();
const checkout=stripe.initCheckoutElementsSdk({
clientSecret:clientSecretPromise,
elementsOptions:{
appearance:{
theme:"night",
variables:{colorPrimary:"#6da5dc",colorBackground:"#101f31",colorText:"#f5f8fc",colorDanger:"#ff7777",fontFamily:"Inter, sans-serif",borderRadius:"8px"}
}
}
});
const paymentElement=checkout.createPaymentElement({
layout:"accordion",
wallets:{applePay:"auto",link:"auto"}
});
paymentElement.mount("#payment-element");
const loaded=await checkout.loadActions();
if(loaded.type!=="success")throw new Error(loaded.error?.message||"Impossible de charger les moyens de paiement.");
const actions=loaded.actions;
stripeReady=true;
button.disabled=false;
button.addEventListener("click",async()=>{
if(button.disabled)return;
button.disabled=true;
status.textContent="";
try{
const result=await actions.confirm({redirect:"always"});
if(result?.type==="error")throw new Error(result.error?.message||"Le paiement n'a pas pu être confirmé.");
}catch(error){status.textContent=error.message||"Le paiement a échoué. Vérifiez les informations et réessayez.";button.disabled=false;}
});
}catch(error){status.textContent=error.message||"Une erreur est survenue.";}
}

<script id="ebagz-hamburger-menu-script">
(()=> {
 const toggle=document.getElementById("siteMenuToggle");
 const menu=document.getElementById("siteMenu");
 const contact=document.getElementById("contactIcons");
 const contactToggle=document.getElementById("contactToggle");
 const contactAction=document.getElementById("siteMenuContact");
 if(toggle&&menu){
  toggle.addEventListener("click",()=>{
   const opening=menu.hidden;
   menu.hidden=!opening;
   toggle.setAttribute("aria-expanded",String(opening));
   if(opening&&contact)contact.hidden=true;
   if(contactToggle)contactToggle.setAttribute("aria-expanded","false");
  });
  document.addEventListener("click",event=>{
   if(!menu.hidden&&!menu.contains(event.target)&&!toggle.contains(event.target)){
    menu.hidden=true;toggle.setAttribute("aria-expanded","false");
   }
  });
  document.addEventListener("keydown",event=>{
   if(event.key==="Escape"){menu.hidden=true;toggle.setAttribute("aria-expanded","false");}
  });
 }
 if(contactAction){
  contactAction.addEventListener("click",()=>{
   if(menu)menu.hidden=true;
   if(toggle)toggle.setAttribute("aria-expanded","false");
   if(contact){contact.hidden=!contact.hidden;contact.scrollIntoView({behavior:"smooth",block:"nearest"});}
  });
 }
})();
</script>
