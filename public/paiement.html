<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#081321">
<title>Récapitulatif — E-BAGS UNLOCK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://js.stripe.com/v3/"></script>
<style>
:root{color-scheme:dark;--bg:#081321;--panel:#101f31;--blue:#6da5dc;--white:#f5f8fc;--muted:#aab7c7;--border:rgba(255,255,255,.12);--error:#ff7777}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,rgba(52,119,190,.25),transparent 52%),linear-gradient(145deg,#050b16,#0a1a2d 48%,#07101e);color:var(--white);font-family:Inter,sans-serif}
header{padding:22px 20px;border-bottom:1px solid var(--border);background:rgba(8,19,33,.95);text-align:center}
.logo{font-size:25px;font-weight:800;letter-spacing:-1px;text-decoration:none;color:var(--white)}.logo span{color:var(--blue)}.logo .apple-mark{color:var(--white);margin-left:5px;font-family:Arial,sans-serif;font-size:.95em}
nav{display:flex;justify-content:center;flex-wrap:wrap;gap:12px 24px;margin-top:13px}nav a{font-size:13px;color:var(--muted);text-decoration:none}
.site-footer{margin-top:auto;padding:24px 20px;text-align:center;border-top:1px solid var(--border);background:rgba(8,19,33,.72)}.footer-logo{display:inline-block;color:var(--white);font-size:22px;font-weight:800;letter-spacing:-1px;text-decoration:none}.footer-logo span:not(.apple-mark){color:var(--blue)}.footer-logo .apple-mark{color:var(--white);margin-left:5px;font-family:Arial,sans-serif;font-size:.95em}
main{width:min(760px,calc(100% - 32px));margin:40px auto 70px}
h1{margin:0 0 24px;text-align:center;font-size:clamp(30px,5vw,40px);letter-spacing:-1px}
.panel{padding:25px;border:1px solid var(--border);border-radius:14px;background:var(--panel);margin-bottom:18px}
h2{font-size:18px;margin:0 0 16px}#payment-title{text-align:center;font-size:clamp(30px,5vw,40px);letter-spacing:-1px;margin:0 0 22px}.line{display:flex;justify-content:space-between;gap:18px;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px}.line:last-child{border:0}.line span{color:var(--muted)}.line strong{text-align:right;overflow-wrap:anywhere}.amount{color:var(--blue);font-size:24px;font-weight:800}
#checkout{min-height:150px}#status{margin-top:14px;text-align:center;color:var(--error);font-size:14px;white-space:pre-wrap}
.back{display:block;text-align:center;color:var(--blue);font-size:13px;text-decoration:none;margin-top:20px}
@media(max-width:520px){main{margin-top:28px}.panel{padding:18px}.line{gap:10px;font-size:13px}}
</style>
</head>
<body>
<header>
<a class="logo" href="https://ebagzunlock.com/">ebagz<span>unlock</span><span class="apple-mark" aria-hidden="true"> </span></a>
<nav aria-label="Navigation principale">
<a href="https://ebagzunlock.com/">Accueil</a>
<a href="https://ebagzunlock.com/?page=offres#services">Services</a>
<a href="https://ebagzunlock.com/?page=offres#tarifs">Tarifs</a>
<a href="https://ebagzunlock.com/?page=offres#fonctionnement">Fonctionnement</a>
</nav>
</header>
<main>
<h1>Récapitulatif</h1>
<section class="panel" aria-labelledby="summary-title">
<h2 id="summary-title">Détails de votre commande</h2>
<div class="line"><span>Prestation</span><strong id="service">—</strong></div>
<div class="line"><span>Appareil / option</span><strong id="device">—</strong></div>
<div class="line"><span>Modèle</span><strong id="model">—</strong></div>
<div class="line"><span>Nom</span><strong id="customer-name">—</strong></div>
<div class="line"><span>E-mail</span><strong id="customer-email">—</strong></div>
<div class="line"><span>Téléphone</span><strong id="customer-phone">—</strong></div>
<div class="line"><span>IMEI / numéro de série</span><strong id="customer-identifier">—</strong></div>
<div class="line" id="message-row" hidden><span>Informations complémentaires</span><strong id="customer-message">—</strong></div>
<div class="line"><span>Total à payer</span><strong class="amount" id="amount">—</strong></div>
</section>
<section class="panel" aria-labelledby="payment-title">
<h2 id="payment-title">Mode de paiement</h2>
<div id="checkout"></div>
<div id="status" role="alert"></div>
</section>
<a class="back" href="https://ebagzunlock.com/?page=offres#tarifs">← Retour aux offres</a>
</main>
<script>
"use strict";
const PUBLISHABLE_KEY="pk_live_51UXyGX75EdsO57RNKonjBJn7r6Q2m2tGmlhzXpz9eQMs2c1ZDmVsp7oecok3jBg3xvcFsUkL3dyjZcKrvGs9iAic00hn3wyox8";
const params=new URLSearchParams(location.search);
let savedSelection={},customer={};
try{savedSelection=JSON.parse(sessionStorage.getItem("ebagzunlock-pending-payment")||"{}");}catch(error){}
try{customer=JSON.parse(sessionStorage.getItem("ebagzunlock-pending-order")||"{}");}catch(error){}
const selection={
service:params.get("service")||savedSelection.service||"",
device:params.get("device")||savedSelection.device||"",
model:params.get("model")||savedSelection.model||""
};
const updatePrices={iOS:7,macOS:15,ebagzunlock:2};
const prices={
"iPhone":{"iPhone X":25,"iPhone XR":25,"iPhone XS":25,"iPhone XS Max":25,"iPhone 11":25,"iPhone 11 Pro":25,"iPhone 11 Pro Max":27,"iPhone 12 mini":25,"iPhone 12":25,"iPhone 12 Pro":29,"iPhone 12 Pro Max":32,"iPhone 13 mini":39,"iPhone 13":40,"iPhone 13 Pro":40,"iPhone 13 Pro Max":42,"iPhone 14":40,"iPhone 14 Plus":40,"iPhone 14 Pro":43,"iPhone 14 Pro Max":49,"iPhone 15":53,"iPhone 15 Plus":55,"iPhone 15 Pro":55,"iPhone 15 Pro Max":59,"iPhone 16":64,"iPhone 16 Plus":59,"iPhone 16 Pro":62,"iPhone 16 Pro Max":69,"iPhone 16e":65,"iPhone 17":69,"iPhone 17 Pro":70,"iPhone 17 Pro Max":77,"iPhone 17e":75,"iPhone 17 Air":79,"iPhone 18":85,"iPhone 18 Pro":89,"iPhone 18 Pro Max":100,"iPhone 18 Duo":95},
"MacBook":{"MacBook Air Intel 2008–2020":35,"MacBook Air M1":38,"MacBook Air M2 13/15 pouces":38,"MacBook Air M3 13/15 pouces":40,"MacBook Air M4 13/15 pouces":40,"MacBook Air M5 13/15 pouces":42,"MacBook Pro Intel":40,"MacBook Pro M1 13/14/16 pouces":45,"MacBook Pro M2":45,"MacBook Pro M3 14/16 pouces":45,"MacBook Pro M4 14/16 pouces":49,"MacBook Pro M5 14/16 pouces":49,"MacBook Pro M6 14 pouces":55,"MacBook 12 pouces 2015–2017":30,"MacBook Neo A18 Pro":133},
"iPad":{"iPad classique 1re–11e génération (A16 inclus)":37,"iPad mini 1–6 (A17 Pro inclus)":39,"iPad Air 1–5":37,"iPad Air M2/M3/M4 11/13 pouces":35,"iPad Pro 9.7 pouces":39,"iPad Pro 10.5 pouces":39,"iPad Pro 11 pouces générations 1–5":45,"iPad Pro 12.9 pouces générations 1–6":49,"iPad Pro M4 11/13 pouces":52,"iPad Pro M5 11/13 pouces":55},
"Apple Watch":{"Apple Watch Series 1–12":54,"Apple Watch SE 1/2/3":63,"Apple Watch Ultra 1/2/3/4":69}};
const updateService="Mise à jour iOS / macOS";
const amount=selection.service===updateService?updatePrices[selection.model]:prices[selection.device]?.[selection.model];
const validCustomer=customer.name&&customer.email&&customer.phone&&customer.identifier;
if(selection.service===updateService&&selection.device!==selection.model)amount=null;
if(!selection.service||!selection.device||!selection.model||!Number.isFinite(amount)||!validCustomer){
document.getElementById("status").textContent="Récapitulatif incomplet. Retournez sur le site et vérifiez les informations de votre commande.";
}else{
document.getElementById("service").textContent=selection.service;
document.getElementById("device").textContent=selection.device;
document.getElementById("model").textContent=selection.model;
document.getElementById("customer-name").textContent=customer.name;
document.getElementById("customer-email").textContent=customer.email;
document.getElementById("customer-phone").textContent=customer.phone;
document.getElementById("customer-identifier").textContent=customer.identifier;
if(customer.message){document.getElementById("customer-message").textContent=customer.message;document.getElementById("message-row").hidden=false;}
document.getElementById("amount").textContent=amount+" €";
startCheckout();
}
async function startCheckout(){
try{
if(!window.Stripe)throw new Error("Le service de paiement Stripe ne se charge pas. Actualisez la page.");
const stripe=Stripe(PUBLISHABLE_KEY);
const checkout=await stripe.initEmbeddedCheckout({
fetchClientSecret:async()=>{
const response=await fetch("/api/create-checkout-session",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({...selection,customer})
});
const data=await response.json();
if(!response.ok||!data.client_secret)throw new Error(data.error||"Impossible de préparer le paiement.");
return data.client_secret;
}
});
checkout.mount("#checkout");
}catch(error){document.getElementById("status").textContent=error.message||"Une erreur est survenue.";}
}
</script>
<footer class="site-footer"><a class="footer-logo" href="https://ebagzunlock.com/">ebagz<span>unlock</span><span class="apple-mark" aria-hidden="true"> </span></a></footer>
</body>
</html>
